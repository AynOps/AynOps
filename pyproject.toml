[project]
name = "AynOps"
version = "1.1.2"
description = "A Model Context Protocol server that gives AI Clients real-time cybersecurity reconnaissance capabilities — WHOIS, DNS enumeration, port scanning, SSL inspection, CVE lookup, IP reputation, ASN lookup and more."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "curl-cffi>=0.15.0",
    "dnspython>=2.8.0",
    "fastmcp>=3.3.1",
    "packaging>=26.2",
    "python-dotenv>=1.2.2",
    "python-nmap>=0.7.1",
    "python-whois>=0.9.6",
    "requests>=2.34.2",
    "tldextract>=5.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# AynOps enforces fail-safe tool boundaries: an MCP server process must never
# crash, so tool entry points intentionally catch broad `Exception` and return
# structured {"success": False, "error": ...} payloads instead (see
# CONTRIBUTING.md, "Fail-Safe Server Resilience"). `BLE001` (blind-except) is
# therefore disabled project-wide; narrower handlers are still used wherever
# specific failure modes are expected (timeouts, parser errors, ...).
ignore = ["BLE001"]

[tool.mcp]
name = "io.github.AynOps/AynOps"
