<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="blurGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- lit glow behind the wordmark, no background fill so it merges with the page -->
  <ellipse cx="500" cy="112" rx="260" ry="90" fill="url(#glow)" filter="url(#blurGlow)"/>

  <!-- wordmark -->
  <text x="500" y="140" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="700" font-size="104" fill="url(#textGrad)">AynOps</text>

  <!-- tagline -->
  <text x="500" y="196" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" letter-spacing="3" fill="#8A97A8" font-weight="600">MCP for reconn analysis</text>
</svg>
